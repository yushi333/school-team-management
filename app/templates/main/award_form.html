{% extends "base.html" %}
{% block title %}上传获奖材料 - ACM校队管理系统{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-plus-lg"></i> 上传获奖材料</h3>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">标题</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">五育类型</label>
                        <select name="wuyu_type" class="form-select" required>
                            <option value="">请选择五育类型</option>
                            {% for key, label in WUYU_TYPES %}
                            <option value="{{ key }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">获奖年份</label>
                        <select name="year" class="form-select" required>
                            <option value="">请选择获奖年份</option>
                            {% for y in years %}
                            <option value="{{ y }}" {% if y == default_year %}selected{% endif %}>{{ y }}年</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">可见范围</label>
                        <select name="visibility" class="form-select" required>
                            <option value="public">公开（所有成员可见）</option>
                            <option value="private">仅自己可见</option>
                        </select>
                        <div class="form-text">选择「仅自己可见」时，只有你和管理员能看到这条材料。</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">选择文件</label>
                        <input type="file" name="file" class="form-control" required>
                        <div class="form-text">支持图片和文档格式（jpg, png, gif, pdf, doc, docx, xls, xlsx, ppt, pptx, zip 等）</div>
                    </div>
                    <button type="submit" class="btn btn-primary">上传</button>
                    <a href="{{ url_for('main.awards') }}" class="btn btn-secondary">返回</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

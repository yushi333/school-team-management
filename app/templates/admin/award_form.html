{% extends "base.html" %}
{% block title %}上传获奖材料 - 管理后台{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('admin.award_list') }}">获奖材料管理</a></li>
        <li class="breadcrumb-item active">上传材料</li>
    </ol>
</nav>

<div class="card">
    <div class="card-body">
        <h5 class="card-title mb-3">上传获奖材料</h5>
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">标题 <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" placeholder="如：2026 ICPC 金牌证书" required maxlength="256">
            </div>
            <div class="mb-3">
                <label class="form-label">描述</label>
                <textarea name="description" class="form-control" rows="3" placeholder="补充说明（可选）"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">选择文件 <span class="text-danger">*</span></label>
                <input type="file" name="file" class="form-control" required>
                <small class="text-muted">支持图片 (jpg/png/gif/webp) 和文档 (pdf/doc/xlsx/zip) 等格式</small>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload"></i> 上传</button>
            <a href="{{ url_for('admin.award_list') }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}

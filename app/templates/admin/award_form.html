{% extends "base.html" %}
{% block title %}上传获奖材料 - 管理后台{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-plus-lg"></i> 上传获奖材料</h4>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">标题</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">选择文件</label>
                        <input type="file" name="file" class="form-control" required>
                        <div class="form-text">支持图片和文档格式（jpg, png, gif, pdf, doc, docx, xls, xlsx, ppt, pptx, zip 等）</div>
                    </div>
                    <button type="submit" class="btn btn-primary">上传</button>
                    <a href="{{ url_for('admin.award_list') }}" class="btn btn-secondary">返回</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

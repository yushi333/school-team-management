{% extends "base.html" %}
{% block title %}教学视频管理 - 管理后台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="bi bi-play-circle"></i> 教学视频管理</h4>
    <a href="{{ url_for('admin.add_tutorial') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> 添加视频</a>
</div>

<div class="card">
    <div class="card-body">
        {% if tutorials %}
        <table class="table table-striped align-middle">
            <thead>
                <tr><th>标题</th><th>链接</th><th>时间</th><th>操作</th></tr>
            </thead>
            <tbody>
                {% for t in tutorials %}
                <tr>
                    <td>{{ t.title }}</td>
                    <td><a href="{{ t.video_url }}" target="_blank" class="text-truncate d-inline-block" style="max-width:300px">{{ t.video_url }}</a></td>
                    <td><small>{{ t.created_at[:10] if t.created_at else '' }}</small></td>
                    <td>
                        <form method="POST" action="{{ url_for('admin.delete_tutorial_route', id=t.id) }}" onsubmit="return confirm('确定删除？');">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted">暂无教学视频。</p>
        {% endif %}
    </div>
</div>
{% endblock %}
